name: 🛒 Generate Prom Feed

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (full fetch)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔐 Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: ♻️ Restore cache (state + prefix map)
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-my-only-${{ github.ref }}-${{ hashFiles('feeds.txt') }}
          restore-keys: |
            state-my-only-${{ github.ref }}-

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp lxml pandas openpyxl xlrd

      - name: 🚀 Generate YML (лише my_ з Google Sheets)
        env:
          ONLY_MY_PRODUCTS: "true"
          ENABLE_ARCHIVE: "false"
          MAX_FILE_SIZE_MB: "78"
          MAX_FILES: "4"
          TIMEOUT: "120"
          PROM_CATEGORIES_SHEET_URL: ${{ secrets.PROM_CATEGORIES_SHEET_URL || '' }}
          MY_PRODUCTS_SHEET_URL: ${{ secrets.MY_PRODUCTS_SHEET_URL || '' }}
        run: python main.py

      - name: 🔎 Перевірка YML
        run: |
          count=$(grep -c '<offer ' all_1.yml || echo 0)
          my_count=$(grep -c 'id="my_' all_1.yml || echo 0)
          other=$((count - my_count))
          echo "offers: $count (my_: $my_count, інші: $other)"
          if [ "$count" -lt 1 ]; then
            echo "❌ all_1.yml порожній"
            exit 1
          fi
          if [ "$other" -gt 0 ]; then
            echo "❌ У YML є товари не з my_ — перевірте ONLY_MY_PRODUCTS і feeds.txt"
            exit 1
          fi
          if [ -z "${{ secrets.MY_PRODUCTS_SHEET_URL }}" ]; then
            echo "❌ Потрібен secret MY_PRODUCTS_SHEET_URL"
            exit 1
          fi

      - name: 🔄 Rebase
        run: git pull --rebase origin main || true

      - name: 📝 Commit YML
        run: |
          rm -f all_2.yml all_3.yml all_4.yml 2>/dev/null || true
          git add -A all_*.yml
          git commit -m "🔄 Update YML (my products only)" || echo "No changes"

      - name: 🔄 Pull before push
        run: git pull --rebase origin main || true

      - name: ⬆️ Push to main
        run: git push origin HEAD:main

      - name: 🔄 Trigger prom-sync-api
        run: |
          response=$(curl -w "\n%{http_code}" -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.DISPATCH_TOKEN }}" \
            https://api.github.com/repos/globusgaz/prom-sync-API/dispatches \
            -d '{"event_type":"yml-updated","client_payload":{"message":"YML my products only"}}')
          http_code=$(echo "$response" | tail -n1)
          body=$(echo "$response" | head -n-1)
          if [ "$http_code" = "204" ]; then
            echo "✅ Prom sync triggered (HTTP $http_code)"
          else
            echo "❌ Prom sync failed (HTTP $http_code): $body"
            exit 1
          fi

      - name: 💾 Save cache
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-my-only-${{ github.ref }}-${{ hashFiles('feeds.txt') }}
