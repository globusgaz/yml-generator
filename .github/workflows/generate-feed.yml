name: 🛒 Generate Prom Feed

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write
  actions: write  # Для repository_dispatch

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (full fetch)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔐 Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: ♻️ Restore cache (state + prefix map)
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-${{ github.ref }}-${{ hashFiles('feeds.txt') }}
          restore-keys: |
            state-${{ github.ref }}-
            state-

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp lxml pandas openpyxl xlrd

      - name: 🔎 Debug workspace
        run: |
          pwd
          ls -la

      - name: 🚀 Generate YML with enrichment
        env:
          # 📊 Енрічмент та фільтрація якості
          ENRICH_STRICT: "true"
          COMPLETENESS_THRESHOLD: "100"
          DROP_NEW_BELOW_THRESHOLD: "true"
          ARCHIVE_EXISTING_BELOW_THRESHOLD: "true"
          
          # 🗄️ Архівація зниклих товарів (вимкнено для оптимізації)
          ENABLE_ARCHIVE: "false"
          ARCHIVE_AFTER_HOURS: "1"
          MAX_ARCHIVE_PER_RUN: "500"
          
          # 📦 Розмір та структура файлів
          MAX_FILE_SIZE_MB: "78"
          MAX_FILES: "4"
          TIMEOUT: "30"
          
          # 🏷️ Категорії та ваші товари (Google Sheets)
          PROM_CATEGORIES_SHEET_URL: ${{ secrets.PROM_CATEGORIES_SHEET_URL || '' }}
          MY_PRODUCTS_SHEET_URL: ${{ secrets.MY_PRODUCTS_SHEET_URL || '' }}
        run: python main.py

      - name: 🔄 Rebase
        run: git pull --rebase origin main || true

      - name: 📝 Commit YML + prefix_map (без product_state.json)
        run: |
          git add all_*.yml prefix_map.json
          git commit -m "🔄 Update YML and prefix map" || echo "No changes"

      - name: 🔄 Pull before push
        run: git pull --rebase origin main || true

      - name: 🔄 Final pull (безпосередньо перед push)
        run: |
          git pull --rebase origin main || true
          sleep 2

      - name: ⬆️ Push to main
        run: git push origin HEAD:main

      - name: 🔄 Trigger prom-sync-api
        run: |
          curl -X POST \
            -H "Accept: application/vnd.github.v3+json" \
            -H "Authorization: token ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/globusgaz/prom-sync-API/dispatches \
            -d '{"event_type":"yml-updated","client_payload":{"message":"YML файли оновлені"}}'
          echo "✅ Запущено синхронізацію з Prom.ua"

      - name: 💾 Save cache (state + prefix map)
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-${{ github.ref }}-${{ hashFiles('feeds.txt') }}

      - name: 📊 Summary
        if: always()
        run: |
          echo "✅ Workflow completed"
          echo "📁 Generated files: $(ls -lh all_*.yml 2>/dev/null | wc -l) YML files"
          echo "💾 Cache preserved: product_state.json, prefix_map.json"

