name: 🛒 Generate Prom Feed

on:
  schedule:
    - cron: '0 */1 * * *'  # Кожні 1 години
  workflow_dispatch:     # Ручний запуск

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Клоную репозиторій
      uses: actions/checkout@v3

    - name: 🐍 Встановлюю Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Встановлюю залежності
      run: |
        pip install aiohttp lxml pandas openpyxl xlrd

    - name: 🚀 Генерую YML
      run: python main.py

    - name: 📝 Комічу зміни
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"
        git add all_*.yml
        git commit -m "🔄 Оновлено YML файли" --allow-empty
        git push
