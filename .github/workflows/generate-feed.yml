name: 🛒 Generate Prom Feed

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (full fetch)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔐 Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: ♻️ Restore cache (state + prefix map)
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-${{ github.ref }}-${{ hashFiles('feeds.txt') }}
          restore-keys: |
            state-${{ github.ref }}-
            state-

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp lxml pandas openpyxl xlrd

      - name: 🚀 Generate YML
        run: python main.py

      - name: 🔄 Rebase
        run: git pull --rebase origin main || true

      - name: 📝 Commit YML + prefix_map (без product_state.json)
        run: |
          git add all_*.yml prefix_map.json
          git commit -m "🔄 Update YML and prefix map" || echo "No changes"
          git push origin HEAD:main
