name: 🛒 Generate Prom Feed

on:
  schedule:
    - cron: '0 * * * *'  # Щогодини (UTC)
  workflow_dispatch:     # Можна запускати вручну

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: 📥 Клоную репозиторій
      uses: actions/checkout@v3
      with:
        fetch-depth: 0

    - name: 🔄 Скидаю до останнього main
      run: |
        git fetch origin main
        git reset --hard origin/main

    - name: 🐍 Встановлюю Python
      uses: actions/setup-python@v4
      with:
        python-version: '3.11'

    - name: 📦 Встановлюю залежності з requirements.txt
      run: pip install -r requirements.txt

    - name: 🚀 Генерую YML
      run: python main.py

    - name: 🧹 Чищу зайві файли
      run: |
        rm -f prev_feed.yml || true
        rm -f output_*.yml || true

    - name: 📝 Комічу у репозиторій з часом
      run: |
        git config user.name "github-actions"
        git config user.email "github-actions@github.com"

        COMMIT_TIME=$(date -u +"%Y-%m-%d %H:%M UTC")
        git add -A
        git commit -m "🔄 Оновлено all.yml ($COMMIT_TIME)" --allow-empty
        git push origin HEAD:main
