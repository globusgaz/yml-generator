name: 🛒 Generate Prom Feed

on:
  schedule:
    - cron: '0 */1 * * *'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout (full fetch)
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: 🔐 Git user
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: ♻️ Restore cache (state + prefix map)
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-${{ github.ref }}-${{ hashFiles('feeds.txt') }}
          restore-keys: |
            state-${{ github.ref }}-
            state-

      - name: 🐍 Python 3.11
        uses: actions/setup-python@v4
        with:
          python-version: '3.11'

      - name: 📦 Deps
        run: |
          python -m pip install --upgrade pip
          pip install aiohttp lxml pandas openpyxl xlrd

      - name: 🔎 Debug workspace
        run: |
          pwd
          ls -la

      - name: 🚀 Generate YML with enrichment
        env:
          # 📊 Енрічмент та фільтрація якості
          ENRICH_STRICT: "true"                      # строге збагачення без вигадки
          COMPLETENESS_THRESHOLD: "95"               # поріг заповненості 0-100 (назва+ціна+фото+опис)
          DROP_NEW_BELOW_THRESHOLD: "true"           # не публікувати нові товари з низькою якістю
          ARCHIVE_EXISTING_BELOW_THRESHOLD: "true"   # архівувати існуючі товари з низькою якістю
          
          # 🗄️ Архівація зниклих товарів
          ENABLE_ARCHIVE: "true"                     # увімкнути архівацію
          ARCHIVE_AFTER_HOURS: "1"                   # архівувати через 1 год відсутності у фідах
          MAX_ARCHIVE_PER_RUN: "500"                 # макс. кількість архівних товарів за раз
          
          # 📦 Розмір та структура файлів
          MAX_FILE_SIZE_MB: "80"                     # макс. розмір файлу (запас до GitHub 100MB)
          MAX_FILES: "4"                             # макс. кількість YML файлів
          TIMEOUT: "30"                              # таймаут завантаження фідів (сек)
          
          # 🏷️ Категорії (опціонально, якщо є Google Sheets)
          PROM_CATEGORIES_SHEET_URL: ${{ secrets.PROM_CATEGORIES_SHEET_URL || '' }}
        run: python main.py

      - name: 🔄 Rebase
        run: git pull --rebase origin main || true

      - name: 📝 Commit YML + prefix_map (без product_state.json)
        run: |
          git add all_*.yml prefix_map.json
          git commit -m "🔄 Update YML and prefix map" || echo "No changes"

      - name: ⬆️ Push to main
        run: git push origin HEAD:main

      - name: 💾 Save cache (state + prefix map)
        uses: actions/cache@v3
        with:
          path: |
            product_state.json
            prefix_map.json
          key: state-${{ github.ref }}-${{ hashFiles('feeds.txt') }}

      - name: 📊 Summary
        if: always()
        run: |
          echo "✅ Workflow completed"
          echo "📁 Generated files: $(ls -lh all_*.yml 2>/dev/null | wc -l) YML files"
          echo "💾 Cache preserved: product_state.json, prefix_map.json"

