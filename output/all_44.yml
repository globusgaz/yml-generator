        <quantity>1</quantity>
        <description>&lt;h2&gt;Зручність і стиль у вашому інтер&amp;#39;єрі&lt;/h2&gt; &lt;p&gt;Висувна меблева потрійна розетка завдяки своєму стильному дизайну, чудово впишеться в будь-який інтер&amp;#39;єр.&amp;nbsp;Це гарне рішення для&amp;nbsp;встановлення на робочих місцях, у конференц-залах або на кухні, де ви хочете мати зручний доступ до розеток або електричних пристроїв, але при цьому заощадити місце.&lt;/p&gt; &lt;p&gt;Меблева розетка має&amp;nbsp;високий ступінь захисту IP40, що надійно захищає її від пилу і дрібних частинок. Врізна розетка виготовлена з міцного &lt;strong&gt;алюмінію&lt;/strong&gt; і покритого спеціальною фарбою, що забезпечує довговічність та надійність.&lt;/p&gt; &lt;p&gt;Вбудована розетка &lt;strong&gt;плавно відкривається &lt;/strong&gt;після натискання кнопки, що забезпечує комфорт у користуванні. Ви зможете зручно підключати електроприлади, не втрачаючи при цьому важливого робочого простору.&lt;/p&gt; &lt;p&gt;Загалом, висувний розетковий блок Livolo - це інноваційний та практичний варіант, який додасть функціональності та зручності вашому приміщенню. Ви отримаєте доступ до електричних джерел без зайвих зусиль, зберігаючи при цьому важливий простір для роботи та творчості.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="642" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_01_ukr%284%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Елегантний зовнішній вигляд і універсальний стиль&lt;/h2&gt; &lt;p&gt;Чисті лінії розетки, бездоганна форма і дбайливо продуманий дизайн надають їй витонченість та привабливість. Завдяки своїй універсальності, розетка&amp;nbsp;гармонійно впишеться в будь-який інтер&amp;#39;єр, незалежно від стилю. Чи це буде класичний, сучасний, мінімалістичний чи еклектичний дизайн - цей елегантний виріб завжди буде виглядати бездоганно.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="864" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_02_ukr%2810%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Універсальне і гнучке рішення&lt;/h2&gt; &lt;p&gt;Ви можете самостійно обирати &lt;a href="https://livolo.in.ua/catalog/five-socket/"&gt;модулі розеток&lt;/a&gt;, які необхідні для вашого конкретного приміщення або робочого місця. Наприклад, якщо вам потрібні звичайні електричні розетки для підключення побутових пристроїв, то ви можете &lt;a href="https://livolo.in.ua/vydvizhnoy-rozetochnyy-blok-na-6-moduley-cherniy-livolo-vl-shs013-b/"&gt;встановити їх у&amp;nbsp;блок&lt;/a&gt;. Або якщо ви працюєте з комп&amp;#39;ютером і потрібні комп&amp;#39;ютерні роз&amp;#39;єми, то також можете обрати відповідні модулі.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="677" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_03_ukr%286%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Простий та стильний дизайн&lt;/h2&gt; &lt;p&gt;Меблева розетка має класичний та елегантний вигляд, що надає приміщенню особливої гідності та шарму. Її стриманий дизайн вражає простотою і стильністю, створюючи атмосферу гармонії та доброго смаку.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="692" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_04_ukr%286%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Оптимізація робочого простору&lt;/h2&gt; &lt;p&gt;Завдяки висувному дизайну, меблева розетка може легко зникнути зі столу або стільниці, коли її не використовують. Це дозволяє ефективно використовувати простір і звільнити його від зайвих розеток, які вже не потрібні.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="682" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_05_ukr%282%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Зручне та логічне розташування&lt;/h2&gt; &lt;p&gt;Кожна розетка розташована в зручному місці, забезпечуючи зручний доступ для підключення пристроїв.&amp;nbsp;Унікальний висувний дизайн розетки дозволяє з легкістю закрити непотрібні розетки.&amp;nbsp;Вам не потрібно буде хвилюватися про зайві кабелі або розетки, які займають місце. Просто закрийте розетку після використання, і ваш робочий простір буде виглядати організовано і заздалегідь підготовлений для наступного завдання.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="689" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_06_ukr%286%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Габаритні розміри&lt;/h2&gt; &lt;p&gt;Меблева розетка має зовнішні розміри 265х118 мм, з глибиною всього 70 мм. Ці компактні розміри дозволяють легко вписати розетку у будь-який меблевий дизайн без зайвого зайняття простору.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="780" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_07_ukr%2813%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;p&gt;Меблевий люк та його монтажна коробка.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="225" loading="lazy" src="https://livolo.in.ua/content/uploads/images/h2a81eaed1c9d47b48f9c2321fa294473i1%281%29.png" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Монтажні розміри&lt;/h2&gt; &lt;p&gt;Розмір монтажної коробки для меблевого люка&amp;nbsp;Livolo.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="207" loading="lazy" src="https://livolo.in.ua/content/uploads/images/h073e28e8020f4160a71dfa04c306e02ag_negate.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;Встановлення&lt;/h2&gt; &lt;p&gt;Для монтажу потрібен розмір отвору 225х110 мм. У коробці з блоком постачається монтажний комплект, що допоможе швидко та легко встановити модульний люк Livolo.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="456" loading="lazy" src="https://livolo.in.ua/content/uploads/images/vl-shs013-setup.jpg" width="700" /&gt;&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="791" loading="lazy" src="https://livolo.in.ua/content/uploads/images/_09_ukr%287%29.jpg" width="700" /&gt;&lt;/p&gt;</description>
        <picture>https://livolo.in.ua/content/images/6/vl-shs013-tcbp-br-92218908597372_+eb1d9a3368.jpg</picture>
      </offer>
