lt;p data-end="2805" data-start="2775"&gt;Пульт ДУ з дальністю до 30 м&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2851" data-start="2806"&gt; &lt;p data-end="2851" data-start="2808"&gt;Керування світлом зі смартфона та голосом&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2889" data-start="2852"&gt; &lt;p data-end="2889" data-start="2854"&gt;Без нейтралі, швидке встановлення&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2935" data-start="2890"&gt; &lt;p data-end="2935" data-start="2892"&gt;LED-підсвічування, стильне скло OptiWhite&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2966" data-start="2936"&gt; &lt;p data-end="2966" data-start="2938"&gt;Підтримка &amp;laquo;Розумного дому&amp;raquo;&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2987" data-start="2967"&gt; &lt;p data-end="2987" data-start="2969"&gt;Захист і безпека&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p data-end="3084" data-start="2989"&gt;LIVOLO &amp;mdash; це поєднання технологій, дизайну та комфорту, яке ви оціните з першого використання.&lt;/p&gt; &lt;hr /&gt; &lt;p&gt;Отже, сенсорний вимикач LIVOLO з пультом дистанційного керування &amp;mdash; це сучасне рішення для комфортного керування світлом у квартирі, будинку чи офісі. Пульт ДУ працює на відстані до 30 метрів, дозволяючи вмикати та вимикати світло з будь-якої точки приміщення, навіть крізь стіни. Керування через смартфон у додатку LIVOLO HOME відкриває додаткові можливості: створення сценаріїв &amp;laquo;Розумного дому&amp;raquo;, налаштування таймерів та розкладів, контроль освітлення з будь-якої точки світу.&lt;/p&gt; &lt;p data-end="992" data-start="605"&gt;Вимикач LIVOLO виготовлений зі скла OptiWhite, має стильний дизайн і LED-підсвічування, яке допомагає орієнтуватися у темряві. Модель встановлюється без нейтрального дроту та сумісна з більшістю типів ламп &amp;mdash; LED, галоген, люмінесцентні, стрічки &amp;mdash; у діапазоні 1&amp;ndash;1000 Вт. Підтримка Google Home та Amazon Alexa дозволяє керувати світлом голосом, роблячи ваш дім ще розумнішим і зручнішим.&lt;/p&gt;