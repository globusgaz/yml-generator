        <description>&lt;p data-end="2138" data-start="1736"&gt;&lt;strong data-end="1811" data-start="1736"&gt;Радіокерований сенсорний вимикач LIVOLO з пультом ДУ та склом OptiWhite&lt;/strong&gt; &amp;mdash; стильне та технологічне рішення для вашого дому. Велика сенсорна панель чутлива до легкого дотику, а LED-підсвічування допоможе знайти вимикач у темряві. &lt;strong data-end="2001" data-start="1968"&gt;Пульт дистанційного керування&lt;/strong&gt; працює на відстані до &lt;strong data-end="2037" data-start="2024"&gt;30 метрів&lt;/strong&gt;, легко проходить крізь стіни та двері, що особливо зручно для дітей, літніх людей та в нічний час.&lt;/p&gt; &lt;p data-end="2430" data-start="2140"&gt;Окрім пульта, ви можете керувати світлом через &lt;strong data-end="2199" data-start="2187"&gt;смартфон&lt;/strong&gt; у додатку &lt;strong data-end="2225" data-start="2210"&gt;LIVOLO HOME&lt;/strong&gt;: налаштовувати таймери, розклади, сцени &amp;laquo;Імітація присутності&amp;raquo; та інтегрувати вимикач у систему &lt;strong data-end="2340" data-start="2322"&gt;&amp;laquo;Розумний дім&amp;raquo;&lt;/strong&gt;. Підтримка &lt;strong data-end="2367" data-start="2352"&gt;Google Home&lt;/strong&gt; та &lt;strong data-end="2387" data-start="2371"&gt;Amazon Alexa&lt;/strong&gt; дає можливість керувати світлом голосом.&lt;/p&gt; &lt;p data-end="2736" data-start="2432"&gt;Встановлення займає кілька хвилин, не потребує нейтрального дроту та підходить для заміни звичайного вимикача. Пристрій сумісний з LED, галогеновими та іншими лампами у діапазоні &lt;strong data-end="2624" data-start="2611"&gt;1&amp;ndash;1000 Вт&lt;/strong&gt;. Виготовлений із загартованого скла та вогнестійких матеріалів, має захист від перепадів напруги й перегріву.&lt;/p&gt; &lt;p data-end="2772" data-start="2738"&gt;&lt;strong data-end="2770" data-start="2738"&gt;Переваги LIVOLO LightSwitch:&lt;/strong&gt;&lt;/p&gt; &lt;ul data-end="2987" data-start="2773"&gt; &lt;li data-end="2805" data-start="2773"&gt; &lt;p data-end="2805" data-start="2775"&gt;Пульт ДУ з дальністю до 30 м&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2851" data-start="2806"&gt; &lt;p data-end="2851" data-start="2808"&gt;Керування світлом зі смартфона та голосом&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2889" data-start="2852"&gt; &lt;p data-end="2889" data-start="2854"&gt;Без нейтралі, швидке встановлення&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2935" data-start="2890"&gt; &lt;p data-end="2935" data-start="2892"&gt;LED-підсвічування, стильне скло OptiWhite&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2966" data-start="2936"&gt; &lt;p data-end="2966" data-start="2938"&gt;Підтримка &amp;laquo;Розумного дому&amp;raquo;&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2987" data-start="2967"&gt; &lt;p data-end="2987" data-start="2969"&gt;Захист і безпека&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p data-end="3084" data-start="2989"&gt;LIVOLO &amp;mdash; це поєднання технологій, дизайну та комфорту, яке ви оціните з першого використання.&lt;/p&gt; &lt;hr /&gt; &lt;p&gt;Отже, сенсорний вимикач LIVOLO з пультом дистанційного керування &amp;mdash; це сучасне рішення для комфортного керування світлом у квартирі, будинку чи офісі. Пульт ДУ працює на відстані до 30 метрів, дозволяючи вмикати та вимикати світло з будь-якої точки приміщення, навіть крізь стіни. Керування через смартфон у додатку LIVOLO HOME відкриває додаткові можливості: створення сценаріїв &amp;laquo;Розумного дому&amp;raquo;, налаштування таймерів та розкладів, контроль освітлення з будь-якої точки світу.&lt;/p&gt; &lt;p data-end="992" data-start="605"&gt;Вимикач LIVOLO виготовлений зі скла OptiWhite, має стильний дизайн і LED-підсвічування, яке допомагає орієнтуватися у темряві. Модель встановлюється без нейтрального дроту та сумісна з більшістю типів ламп &amp;mdash; LED, галоген, люмінесцентні, стрічки &amp;mdash; у діапазоні 1&amp;ndash;1000 Вт. Підтримка Google Home та Amazon Alexa дозволяє керувати світлом голосом, роблячи ваш дім ще розумнішим і зручнішим.&lt;/p&gt;</description>
