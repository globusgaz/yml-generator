габаритами 80x80 мм, та глибиною 33 мм, встановлення цього шедевру в&amp;nbsp;&lt;a href="https://livolo.in.ua/kruglyy-podrozetnik-dlya-montazha-vykluchateley-livolo-eu-60-mw/"&gt;круглу стандартну монтажну коробку&lt;/a&gt;&amp;nbsp;стає надзвичайно простим.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting9.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__text"&gt; &lt;div class="ck-image-text-left__title"&gt; &lt;h2&gt;Підключення&lt;/h2&gt; &lt;p&gt;Надзвичайно проста схема підключення, всього два дроти, фазний та нульовий провід.&amp;nbsp;Це дозволяє встановити світильник без додаткових зусиль або спеціальних знань.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__image-wrapper"&gt;&lt;img alt="" height="215" loading="lazy" src="/content/uploads/images/svtilnik-proxdniy-1.jpg" width="1000" /&gt;&lt;/div&gt; &lt;/div&gt;</description>
