;/p&gt; &lt;/li&gt; &lt;li data-end="2913" data-start="2879"&gt; &lt;p data-end="2913" data-start="2881"&gt;Таймер та автоматичні сценарії&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2951" data-start="2914"&gt; &lt;p data-end="2951" data-start="2916"&gt;Керування зі смартфона та голосом&lt;/p&gt; &lt;/li&gt; &lt;li data-end="3011" data-start="2952"&gt; &lt;p data-end="3011" data-start="2954"&gt;Безпечне керування двигуном і захист від перевантаження&lt;/p&gt; &lt;/li&gt; &lt;li data-end="3050" data-start="3012"&gt; &lt;p data-end="3050" data-start="3014"&gt;Стильне загартоване скло OptiWhite&lt;/p&gt; &lt;/li&gt; &lt;li data-end="3095" data-start="3051"&gt; &lt;p data-end="3095" data-start="3053"&gt;Просте встановлення з нейтральним дротом&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p data-end="3187" data-start="3097"&gt;LIVOLO &amp;mdash; поєднання безпеки, комфорту та сучасного дизайну у вашій системі автоматизації.&lt;/p&gt; &lt;hr /&gt; &lt;p&gt;Отже.&amp;nbsp;Сенсорний вимикач LIVOLO для ролет, штор, електрокарнизів і воріт з пультом дистанційного керування та таймером &amp;mdash; сучасний інструмент для автоматизації простору. Пульт працює на відстані до 30 метрів, забезпечуючи комфортне керування з будь-якої точки дому. Керування через смартфон у додатку LIVOLO HOME відкриває можливості створення сценаріїв &amp;laquo;Розумного дому&amp;raquo;, налаштування розкладів і таймерів. Модель підтримує голосових асистентів Google Home та Amazon Alexa. Виготовлений із загартованого скла, вимикач гармонійно вписується в будь-який інтер&amp;rsquo;єр і сумісний із різними типами двигунів, забезпечуючи безпечну та стабільну роботу.&lt;/p&gt;</description>
