        <description>&lt;h2 class="ck-image-text-left__image-wrapper"&gt;Світильник для сходів з автоматичним включенням: Безпечність та комфорт у нічний час&lt;/h2&gt; &lt;p&gt;Світильник для сходів - це стильне та практичне рішення для забезпечення безпеки та комфорту під час ходіння по сходах. Він оснащений &lt;strong&gt;датчиком руху&lt;/strong&gt;, який&amp;nbsp;дозволяє автоматично вмикатися при проходженні людини, а також &lt;strong&gt;датчиком освітленості&lt;/strong&gt;, який визначає, чи потрібне освітлення в цей час доби.&lt;/p&gt; &lt;h2&gt;Переваги&lt;/h2&gt; &lt;ol&gt; &lt;li&gt;&lt;strong&gt;Автоматичне включення при русі:&lt;/strong&gt; Світильник активується при вашому проходженні, надаючи необхідне освітлення у нічний час.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Автоматичне виключення:&lt;/strong&gt; Вимикається автоматично через 40 секунд, щоб заощадити електроенергію, коли вас вже немає.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Працює лише в темний час доби:&lt;/strong&gt; Сутінковий датчик реагує на рівень освітленості&amp;nbsp;та активує освітлення при виявленому руху лише в той час доби, коли це дійсно потрібно.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Приємний колір світіння: &lt;/strong&gt;Надає м&amp;#39;яке освітлення без перешкодження сну.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Скляна рамка: &lt;/strong&gt;Забезпечує надійний захист від подряпин, зберігаючи бездоганність його вигляду навіть після тривалого використання.&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;У загальному, світильник для сходів з датчиком руху та освітленості є практичним та безпечним варіантом освітлення для різних приміщень. Він забезпечує ефективне та економічне освітлення в нічний час, а також забезпечує безпеку та комфорт при ходінні по сходах, коридорах та підлозі.&lt;/p&gt; &lt;h2&gt;З двома датчиками: рухи та освітленості&lt;/h2&gt; &lt;p&gt;Світильник вмикається автоматично при умові&amp;nbsp;недостатнього освітлення&amp;nbsp;та за наявності руху на відстані до 4 метрів.&lt;/p&gt; &lt;div class="ck-image-text-left__image-wrapper"&gt;&lt;iframe allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen="" frameborder="0" height="400" loading="lazy" scrolling="no" src="https://www.youtube.com/embed/pf6YkYELJNo" title="Светильник для лестниц с датчиком движения Livolo" width="700"&gt;&lt;/iframe&gt;&lt;/div&gt; &lt;h2&gt;Поради з встановлення&lt;/h2&gt; &lt;p&gt;Важливо дотримуватися правильних кроків для забезпечення безпеки та ефективності. Ось кілька порад для встановлення світильника:&lt;/p&gt; &lt;ol&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Висота встановлення:&lt;/strong&gt;&amp;nbsp;Перш за все, виміряйте відстань від місця встановлення до сходів, щоб забезпечити належне освітлення. Зазвичай світильник встановлюється на висоті 10-30 см від сходинки.&amp;nbsp;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Місце встановлення:&lt;/strong&gt;&amp;nbsp;Оберіть місце, де світильник буде найбільш ефективним та забезпечить рівномірне освітлення сходів.&amp;nbsp;Зазвичай світильник встановлюється через сходинку.&amp;nbsp;&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Монтаж у підрозетник:&lt;/strong&gt;&amp;nbsp;Світильник має бути встановлений у&lt;a href="https://livolo.in.ua/kruglyy-podrozetnik-dlya-montazha-vykluchateley-livolo-eu-60-mw/"&gt;&amp;nbsp;круглу монтажну коробку&lt;/a&gt;.&amp;nbsp;Вставте світильник у підрозетник та закріпіть його за допомогою гвинтів.&lt;/p&gt; &lt;/li&gt; &lt;li&gt; &lt;p&gt;&lt;strong&gt;Підключення до мережі:&lt;/strong&gt;&amp;nbsp;Під&amp;#39;єднайте&amp;nbsp;світильник&amp;nbsp;до мережі 200 вольтів.&lt;/p&gt; &lt;/li&gt; &lt;/ol&gt; &lt;p&gt;&lt;img alt="" height="370" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting1.jpg" width="650" /&gt;&lt;/p&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;h2 class="ck-image-text-right__title"&gt;Вишукано і витончено&lt;/h2&gt; &lt;p class="ck-image-text-right__title"&gt;Акцент до кожної деталі&lt;/p&gt; &lt;p class="ck-image-text-right__title"&gt;&lt;img alt="" height="368" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting2.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;div class="ck-image-text-right__title"&gt; &lt;h2&gt;Загартоване скло&lt;/h2&gt; &lt;p&gt;Забезпечує надійний захист від подряпин і сколів, зберігаючи бездоганність його вигляду навіть після тривалого використання.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="369" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting3.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__text"&gt; &lt;div class="ck-image-text-left__title"&gt; &lt;h2 class="ck-image-text-right__title"&gt;Не вицвітає і не жовтіє&lt;/h2&gt; &lt;p&gt;Завжди новий вид з плином часу&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="370" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting4.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;div class="ck-image-text-right__title"&gt; &lt;h2 class="ck-image-text-right__title"&gt;Чутливий датчик руху&lt;/h2&gt; &lt;p&gt;Спрацьовує на відстані до 4 метрів, чутливий кут 120 &amp;deg;&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="551" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting5.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div 