&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2738" data-start="2700"&gt; &lt;p data-end="2738" data-start="2702"&gt;Таймери та автоматизація сценаріїв&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2771" data-start="2739"&gt; &lt;p data-end="2771" data-start="2741"&gt;Без нейтралі &amp;mdash; легкий монтаж&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2800" data-start="2772"&gt; &lt;p data-end="2800" data-start="2774"&gt;П&amp;rsquo;ять способів керування&lt;/p&gt; &lt;/li&gt; &lt;li data-end="2835" data-start="2801"&gt; &lt;p data-end="2835" data-start="2803"&gt;Підтримка Alexa та Google Home&lt;/p&gt; &lt;/li&gt; &lt;/ul&gt; &lt;p data-end="2905" data-start="2837"&gt;LIVOLO &amp;mdash; технології, комфорт і гнучке керування вашим освітленням.&lt;/p&gt; &lt;hr /&gt; &lt;p&gt;Отже,&amp;nbsp;Двоканальне реле LIVOLO з пультом дистанційного керування &amp;mdash; універсальний інструмент для автоматизації освітлення та електроприладів. Дає змогу керувати двома незалежними лініями світла або іншими пристроями через смартфон, пульт, голосові команди, бездротовий вимикач або сенсорну панель. Пристрій не вимагає нейтралі, встановлюється у стандартні або глибокі монтажні коробки та сумісне з будь-якими джерелами світла. Таймери та сценарії допоможуть оптимізувати використання електроенергії, а підтримка Google Home та Alexa зробить керування максимально зручним.&lt;/p&gt;</description>
