title"&gt;Вишукано і витончено&lt;/h2&gt; &lt;p class="ck-image-text-right__title"&gt;Акцент до кожної деталі&lt;/p&gt; &lt;p class="ck-image-text-right__title"&gt;&lt;img alt="" height="368" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting2.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;div class="ck-image-text-right__title"&gt; &lt;h2&gt;Загартоване скло&lt;/h2&gt; &lt;p&gt;Забезпечує надійний захист від подряпин і сколів, зберігаючи бездоганність його вигляду навіть після тривалого використання.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="369" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting3.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__text"&gt; &lt;div class="ck-image-text-left__title"&gt; &lt;h2 class="ck-image-text-right__title"&gt;Не вицвітає і не жовтіє&lt;/h2&gt; &lt;p&gt;Завжди новий вид з плином часу&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="370" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting4.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;div class="ck-image-text-right__title"&gt; &lt;h2 class="ck-image-text-right__title"&gt;Чутливий датчик руху&lt;/h2&gt; &lt;p&gt;Спрацьовує на відстані до 4 метрів, чутливий кут 120 &amp;deg;&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="551" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting5.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;div class="ck-image-text-right__title"&gt; &lt;h2 class="ck-image-text-left__title"&gt;Високоякісна світлодіодна мікросхема&lt;/h2&gt; &lt;p&gt;Низьке електроспоживання.&amp;nbsp;Напруга 220 вольтів. Потужність 0,35 Вт.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="326" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting6.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__text"&gt; &lt;div class="ck-image-text-left__title"&gt; &lt;h2 class="ck-image-text-right__title"&gt;Інтелектуальний сенсор&lt;/h2&gt; &lt;p&gt;Автоматично вмикається в темну пору доби.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="679" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting7.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-right ck-image-text-right_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-right__text"&gt; &lt;div class="ck-image-text-right__title"&gt; &lt;h2&gt;Модульна система&lt;/h2&gt; &lt;p&gt;Включає не лише&amp;nbsp;&lt;a href="https://livolo.in.ua/mekhanizm-svetilnik-dlya-lestnits-podsvetka-pola-livolo-s-datchikom-dvizheniya-782800511-belyy/"&gt;світильник для сходів&amp;nbsp;Livolo&lt;/a&gt;, але й&amp;nbsp;&lt;a href="https://livolo.in.ua/products/vl-c7-sr-11/"&gt;елегантну рамку&lt;/a&gt;, яка&amp;nbsp;візуально завершує його образ.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="384" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting8.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__text"&gt; &lt;div class="ck-image-text-left__title"&gt; &lt;h2&gt;&lt;strong&gt;Розмір&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;З компактними габаритами 80x80 мм, та глибиною 33 мм, встановлення цього шедевру в&amp;nbsp;&lt;a href="https://livolo.in.ua/kruglyy-podrozetnik-dlya-montazha-vykluchateley-livolo-eu-60-mw/"&gt;круглу стандартну монтажну коробку&lt;/a&gt;&amp;nbsp;стає надзвичайно простим.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/c7-floor-lighting9.jpg" width="650" /&gt;&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__text"&gt; &lt;div class="ck-image-text-left__title"&gt; &lt;h2&gt;Підключення&lt;/h2&gt; &lt;p&gt;Надзвичайно проста схема підключення, всього два дроти, фазний та нульовий провід.&amp;nbsp;Це дозволяє встановити світильник без додаткових зусиль або спеціальних знань.&lt;/p&gt; &lt;/div&gt; &lt;/div&gt; &lt;/div&gt; &lt;div class="ck-image-text-left ck-image-text-left_type_lite ck-theme-blue"&gt; &lt;div class="ck-image-text-left__image-wrapper"&gt;&lt;img alt="" height="215" loading="lazy" src="/content/uploads/images/svtilnik-proxdniy-1.jpg" width="1000" /&gt;&lt;/div&gt; &lt;/div&gt;</description>
        <picture>https://livolo.in.ua/content/images/10/vl-c7fcls-2ap-23961968962951_+f4a6e63497.jpg</picture>
      </offer>
