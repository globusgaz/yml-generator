        <description>&lt;h2&gt;Сенсорний вимикач LIVOLO - революційне, стильне і практичне рішення для вашої оселі&lt;/h2&gt; &lt;p&gt;Завдяки поєднанню передових технологій, майстерного дизайну та простоти використання, наші сенсорні вимикачі стають справжнім центром інновацій в вашому домі.&lt;/p&gt; &lt;p&gt;Ви тільки задумайтеся на хвилину - ми купуємо собі розумні пристрої для підвищення власного комфорту, проте, продовжуємо включати та вимикати світло у ванній або, скажімо, в передпокої, старими клавішними вимикачами з пластику.&lt;/p&gt; &lt;p&gt;Прийшов час змінити це! Фахівці LIVOLO вирішили змінити основу основ - сам принцип керування&amp;nbsp;світлом&amp;nbsp;в будинку.&amp;nbsp;Один дотик - і ваша оселя оживає.&amp;nbsp;Лише одним дотиком ви керуєте освітленням в кімнаті, вітальні, офісі, ви просто уявіть наскільки це зручно!&lt;/p&gt; &lt;p&gt;Гладка, з елегантними лініями, приємна на дотик поверхня сенсорного вимикача дарує непередавані тактильні відчуття. М&amp;#39;яке&amp;nbsp;світлодіодне підсвічування і легкий звук включення додадуть додатковий комфорт.&lt;/p&gt; &lt;p&gt;Користь даного розумного пристрою важко переоцінити.&amp;nbsp;Все, що вам потрібно, - це легкий дотик до елегантного сенсорного екрана, щоб змінити атмосферу вашого приміщення.&lt;/p&gt; &lt;p&gt;Але LIVOLO - це не просто стильний дизайн та легкість використання. Ми також покладаємо великий акцент на безпеку та енергоефективність. Наші вимикачі оснащені спеціальними системами захисту, які гарантують вашу безпеку та захист від короткого замикання. Крім того, наші продукти допомагають ефективно керувати електричними приладами, що дозволяє зменшити споживання енергії та зберегти ресурси планети.&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Переваги сенсорного вимикача&lt;/strong&gt;&lt;/h2&gt; &lt;ul&gt; &lt;li&gt;&lt;strong&gt;Зручне управління&lt;/strong&gt;: Вимикач активується при дотику долонею або пальцем, що робить його зручним у використанні.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Висока безпека&lt;/strong&gt;: Можна включати вимикач навіть мокрими руками, що забезпечує безпеку вологих приміщень, наприклад, ванних кімнат.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Підсвічування&lt;/strong&gt;: Світлодіодна підсвітка дозволяє легко знайти вимикач навіть у темряві, що забезпечує зручність використання.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Простий монтаж&lt;/strong&gt;: Легкість в монтажі дозволяє швидко встановити вимикач всього за кілька хвилин.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Дистанційне керування&lt;/strong&gt; (опція): Існує можливість дистанційного керування вимикачем, що забезпечує зручність управління освітленням з використанням мобільного пристрою.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Надійність&lt;/strong&gt;: Вимикач має високу надійність і може пройти близько 100 000 циклів використання, що гарантує тривалий термін служби.&lt;/li&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Сенсорне управління&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;У сенсорну панель вбудовані інноваційні ємнісні датчики. Завдяки їм, вимикач реагує на найменші дотики до панелі управління. Датчики спрацьовують, навіть якщо Ви доторкнетеся до панелі мокрими руками.&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/chutliviy-sensor_optimized.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Загартоване скло&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Гладка, з елегантними лініями, приємна на дотик поверхня сенсорного вимикача дарує непередавані тактильні відчуття. Поверхня сенсорного вимикача виготовлена з високоміцного загартованого скла.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="337" loading="lazy" src="https://livolo.in.ua/content/uploads/images/100%284%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Підсвічування сенсорної зони&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Стильна LED-підсвітка навколо сенсорної зони вимикача створює ефектну атмосферу і дозволяє легко знайти його навіть у темряві. Підсвічування має різні кольори, у&amp;nbsp;вимкненому стані підсвічування синє, у включеному - червоне.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/nformativna-pdsvtka-2_optimized.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Вологонепроникний&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Сенсорні вимикачі LIVOLO є вологонепроникними та підходять для використання у вологих приміщеннях, таких як ванні кімнати. Вони відповідають вимогам безпеки та захисту від вологи, забезпечуючи надійну та безпечну роботу у таких умовах.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="647" loading="lazy" src="https://livolo.in.ua/content/uploads/images/vologostykiy%282%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Довговічні. Завжди як новий&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Сенсорні вимикачі LIVOLO відмінно витримують випробування часу і зберігають свій первозданний вигляд, завжди виглядаючи як нові.&amp;nbsp;Скло OptiWite захищає від механічного впливу і запобігає появі подряпин і інших дрібних дефектів. До того ж воно не потребує особливого догляду.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/htb1ruq5xvwg3kvjszfpq6xaixxar.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Вогнестійкі&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Вогнестійкі матеріали забезпечують додатковий захист. Панель із загартованого скла витримує температуру до 300&amp;deg;С. Відсутність механічних деталей виключає можливість утворення іскор.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="384" loading="lazy" src="https://livolo.in.ua/content/uploads/images/vognestykiy_optimized.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Інтелектуальний процесор&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Процесор контролює всі аспекти роботи вимикача, забезпечуючи зручність, ефективність та безпеку.&amp;nbsp;У випадку перегорання лампи, сенсорний вимикач автоматично відключається. Це дозволяє забезпечити&amp;nbsp;додатковий рівень автономної системи безпеки.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="280" loading="lazy" src="https://livolo.in.ua/content/uploads/images/916889888_w640_h2048_banner04.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Стандартний монтаж&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Сенсорні вимикачі LIVOLO мають стандартний монтаж, що робить їх сумісними зі звичайною проводкою. Вони легко встановлюються у круглі підрозетники, що використовуються в нашій країні згідно з будівельними стандартами.&amp;nbsp;Таким чином, установка сенсорних вимикачів LIVOLO є легкою і зручною.&lt;/p&gt; &lt;p&gt;&lt;a href="https://livolo.in.ua/pages/support/"&gt;&lt;img alt="" height="310" loading="lazy" src="https://livolo.in.ua/content/uploads/images/2268747891_2268747891%281%29.jpg" width="700" /&gt;&lt;/a&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Класичне підключення&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Підключення до електромережі відбувається за стандартною схемою.&amp;nbsp;Ви можете встановити сенсорний вимикач без необхідності вносити зміни в електропроводку. Нуль не потрібен. Це робить процес установки дуже простим і ефективним.&lt;/p&gt; &lt;p&gt;&lt;a href="https://livolo.in.ua/pages/support/"&gt;&lt;img alt="" height="384" loading="lazy" src="https://livolo.in.ua/content/uploads/images/klasichne-pdkluchennja_optimized.jpg" width="700" /&gt;&lt;/a&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Сумісність з усіма лампами&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Сенсорні вимикачі LIVOLO&amp;nbsp;сумісні з різними типами ламп та освітлювальних пристроїв забезпечуючи вам велику свободу вибору освітлення для вашого будинку:&amp;nbsp;LED лампи, LED стрічки, економки, галогенні лампи, точкові світильники, розумні люстри з пультом, і багато інших.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="387" loading="lazy" src="https://livolo.in.ua/content/uploads/images/pdxodit-dlja-vsx-lamp%283%29.jpg" width="700" /&gt;&lt;/p&gt; &lt;h2&gt;&lt;strong&gt;Безпечні&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;Всі електронні частини вимикачів надійно закриті та захищені, що запобігає потенційній небезпеці виникнення іскор на контактах.&amp;nbsp;Ви можете бути впевнені в їх надійності та безпеці використання у своєму будинку.&lt;/p&gt; &lt;p&gt;&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/bezpechn_optimized.jpg" width="700" /&gt;&lt;/p&gt; &lt;ul&gt; &lt;/ul&gt; &lt;h2&gt;&lt;b&gt;Регулювання яскравості світла *&lt;/b&gt;&lt;/h2&gt; &lt;p&gt;Можливість регулювання яскравості світла, що дозволяє вам плавно включати та вимикати світильники. Це особливо зручно в темний період доби, коли потрібно поступово налаштовувати освітлення на комфортний рівень.&lt;/p&gt; &lt;p&gt;&lt;a href="https://livolo.in.ua/catalog/dimmery/"&gt;&lt;img alt="" height="386" loading="lazy" src="https://livolo.in.ua/content/uploads/images/sensorne-reguluvannja-jaskravost_optimized.jpg" width="700" /&gt;&lt;/a&gt;&lt;/p&gt; &lt;h2&gt;&lt;b&gt;Дистанційне управління *&lt;/b&gt;&lt;/h2&gt; &lt;p&gt;Зручна можливість керувати освітленням будинку з вашого телефона. З&amp;nbsp;розумним вимикачем від LIVOLO користувач може налаштувати включення світла в приміщенні за розкладом, вручну або за попередньо написаним сценарієм. Це дає можливість економити енергію та забезпечує максимальну зручність користування вимикачем.&lt;/p&gt; &lt;p&gt;&lt;a href="https://livolo.in.ua/wi-fi-vykluchateli-i-rozetki/"&gt;&lt;img alt="" height="620" loading="lazy" src="https://livolo.in.ua/content/uploads/images/keruvannja-z-dodatka%281%29.jpg" width="700" /&gt;&lt;/a&gt;&lt;/p&gt; &lt;ul&gt; &lt;/ul&gt; &lt;h2&gt;&lt;strong&gt;Інструкція із встановлення&lt;/strong&gt;&lt;/h2&gt; &lt;p&gt;1. Вимкніть напругу;&lt;/p&gt; &lt;p&gt;2. Підключайте вимикач згідно зі схемою;&lt;/p&gt; &lt;p&gt;3. Прикрутіть вимикач гвинтами до підрозетника;&lt;/p&gt; &lt;p&gt;4. Встановіть сенсорну панель;&lt;/p&gt; &lt;p&gt;5. Подайте напругу;&lt;/p&gt; &lt;p&gt;6. Вимикач починає працювати через 15 секунд.&lt;/p&gt; &lt;h2&gt;&lt;a href="https://livolo.in.ua/pages/support/"&gt;&lt;img alt="" loading="lazy" src="https://livolo.in.ua/content/uploads/images/livolo-vstanivlennya-vymykacha%281%29.jpg" /&gt;&lt;/a&gt;Найчастіші питання&lt;/h2&gt; &lt;p&gt;&lt;strong&gt;1. Вимикач має підсвітку&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Так, всі наші сенсорні перемикачі мають світлодіодні індикатори. Коли вмикається перемикач, загоряється червоний індикатор, а коли вимикається, загоряється синій індикатор.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;2. Чи можу я використовувати вимикач зі світлодіодними лампами&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Так, наші вимикачі можуть працювати з енергозберігаючими лампами та світлодіодними лампами, якщо потужність перевищує 1 Вт.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;3. Які лампи підходять до диммера&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Світлодіодна лампа з регулюванням яскравості.&amp;nbsp;Всі лампочки які працюють з механічним диммером, також будуть працювати з сенсорним димером, тільки потужність повинна бути 5-500 Вт.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;4. Чи може вимикач працювати з системою домашньої автоматизації іншого бренду&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Це залежить від системи. Якщо системі потрібен лише сигнал увімкнено/вимкнено, то це можливо.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;5. Чи є у вас проміжний вимикач&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Так, наш прохідний вимикач також може використовуватися як проміжний перемикач. Ви можете під&amp;#39;єднати три прохідних вимикачі разом.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;6. Який тип включення у вимикача, реле або симистор&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Для вмикання/вимикання сенсорного вимикача використовується&amp;nbsp; реле, для диммера &amp;ndash; симистор.&lt;/p&gt; &lt;p&gt;&lt;strong&gt;7. Чи можна встановити вимикач вертикально&lt;/strong&gt;&lt;/p&gt; &lt;p&gt;Звичайно, будь-яке встановлення.&lt;/p&gt;</description>
      </offer>
