        <description>&lt;h2 class="ck-image-text-left__image-wrapper"&gt;Світильник для сходів з автоматичним включенням: Безпечність та комфорт у нічний час&lt;/h2&gt; &lt;p&gt;Світильник для сходів - це стильне та практичне рішення для забезпечення безпеки та комфорту під час ходіння по сходах. Він оснащений &lt;strong&gt;датчиком руху&lt;/strong&gt;, який&amp;nbsp;дозволяє автоматично вмикатися при проходженні людини, а також &lt;strong&gt;датчиком освітленості&lt;/strong&gt;, який визначає, чи потрібне освітлення в цей час доби.&lt;/p&gt; &lt;h2&gt;Переваги&lt;/h2&gt; &lt;ol&gt; &lt;li&gt;&lt;strong&gt;Автоматичне включення при русі:&lt;/strong&gt; Світильник активується при вашому проходженні, надаючи необхідне освітлення у нічний час.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Автоматичне виключення:&lt;/strong&gt; Вимикається автоматично через 40 секунд, щоб заощадити електроенергію, коли вас вже немає.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Працює лише в темний час доби:&lt;/strong&gt; Сутінковий датчик реагує на рівень освітленості&amp;nbsp;та активує освітлення при виявленому руху лише в той час доби, коли це дійсно потрібно.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Приємний колір світіння: &lt;/strong&gt;Надає м&amp;#39;яке освітлення без перешкодження сну.&lt;/li&gt; &lt;li&gt;&lt;strong&gt;Скляна рамка: &lt;/strong&gt;Забезпечує надійний захист від подряпин, зберігаючи бездоганність його вигляду навіть після тривалого використання.&lt;/li&gt; &lt;/ol&gt; &lt;p&gt;У загальному, світильник для сходів з датчиком руху та освітленості є практичним та безпечним варіантом освітлення для різних приміщень. Він забезпечує ефективне та економічне освітлення в нічний час, а також забезпечує безпеку та комфорт при ходінні по сходах, коридорах та підлозі.&lt;/p&gt; &lt;h2&gt;З двома датчиками: рухи та освітленості&lt;/h2&gt; &lt;p&gt;Світильник вмикається автоматично при умові&amp;nbsp;недостатнього освітлення&amp;nbsp;та за наявності руху на відстані до 4 метрів.&lt;/p&gt; &lt;div cl