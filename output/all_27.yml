        <description>Трость мужская Zest черный -16 спиц (очень большой и надежный) 130см. Предлагаем черный «президентский» зонт от всемирно известно производителя. Специалисты английской компании Zest постарались и представили нашему вниманию действительно королевский зонт, от которого не откажется ни один мужчина в мире. В этом зонтике каждая деталь говорит о том, что он создавался для мужчин, которые превыше всего ставят качество и надежность зонта. Большой зонт Zest может похвастаться огромным куполом, прочным каркасом и оригинальным дизайном купола. Последний окрашен в классический черный цвет, однако, за счет увеличенного количества спиц, смотрится купол очень интересно и стильно. В конструктивном плане данная модель представляет собой зонт-трость, оснащенный механической системой открытия-закрытия купола. Длина зонта в сложенном виде составляет 102 см. Купол, как и подобает зонту для двоих, просто огромен и имеет диаметр 130 см. Ручка большого зонтика Zest сделана не из пластика, как у большинства других моделей, а из дерева. Это еще раз доказывает нам то, что зонт предназначен для солидных, деловых мужчин. Материал ручки: дерево. Количество спиц (шт.): 16. Длина спицы (см): 76. Длина зонта (см): 102. Материал каркаса: стекловолокно. Материал купола: полиэстр.</description>
