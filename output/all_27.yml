        <description>Детский зонт ZEST-механика прозрачный, форма купола - колокол Материал каркаса: фибер. Материал купола: поливинил. Материал ручки: пластик. Количество спиц (шт.): 8. Длина спицы (см): 50. Длина зонта (см): 66. Диаметр раскрытого купола (по концам противоположных спиц зонта) 76 см. Каркас зонта выполнен из восьми спиц, зонт имеет удобную рукоятку закругленной формы.Такой зонтик поднимет настроение и станет незаменимым атрибутом прогулки. Ребенок сможет сам открывать и закрывать зонтик, благодаря легкому механизму, а оригинальная расцветка зонтика привлечет к себе внимание. Слово «детский» в названии модели связано не только с легкомысленным, мультяшным рисунком купола, но и с конструкцией основных элементов аксессуара. В первую очередь, обратите внимание на купол . Под зонтом, крыша которого сделана из прочнейшего поливинила, можно укрыться от любого дождика. Капли просто не смогут попасть внутрь, потому что купол выполнен в виде полусферы. Таким образом, ребенок находится внутри своеобразного защитного кокона, но при этом видит все, что происходит вокруг него. Очень интересное и оригинальное решение. Поработали специалисты Zest и над другими элементами зонта. Модель выполнена в форм-факторе трость и оснащена надежной механической системой открытия-закрытия купола. С таким детским зонтиком можно гулять целыми днями напролет и играть в любые игры. Он не подведет, ведь ломаться тут просто нечему! Добавьте к перечисленным достоинствам удобную, изогнутую ручку с противоскользящим покрытием, небольшой вес аксессуара (менее 300 грамм), крепкий каркас и вы получите идеальный детский зонт на все случаи жизни.</description>
